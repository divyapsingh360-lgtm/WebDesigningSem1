<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Links Demo</title>
</head>
<body id="top">

  <p>Links demo</p>

  <!-- External Link -->
  <a href="https://example.com" target="_blank" title="Visit External Website">External link</a><br>

  <!-- Internal Link (Bookmark) -->
  <a href="#bottom" title="Go to bottom of page">Jump to bottom</a><br>

  <!-- Email Link -->
  <a href="mailto:info@college.edu" title="Send us an email">Email us</a><br>

  <!-- Image Link -->
  <a href="https://example.com" title="College Logo">
    <img src="logo.png" alt="Logo" width="120" height="60">
  </a>

  <!-- Spacer to push bottom content down -->
  <div style="height: 300px;"></div>

  <!-- Bottom Target & Back to Top Link -->
  <p id="bottom">
    Bottom. <a href="#top">Back to top</a>
  </p>

</body>
</html>
